services:
  app:
    image: ${RECALL_IMAGE}
    container_name: ${RECALL_CONTAINER}
    labels:
      io.recall.dataset: browser-source-maps
      io.recall.repo: ToolJet/ToolJet
    env_file: ${RECALL_ENV_FILE}
    ports:
      - "127.0.0.1:${RECALL_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 50
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: tooljet
      POSTGRES_PASSWORD: ${PG_PASS}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tooljet"]
      interval: 3s
      timeout: 4s
      retries: 25
  postgrest:
    image: postgrest/postgrest:v12.2.0
    environment:
      PGRST_DB_URI: postgres://tooljet:${PG_PASS}@postgres:5432/tooljet_db
      PGRST_DB_ANON_ROLE: tooljet
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    depends_on:
      app:
        condition: service_healthy
