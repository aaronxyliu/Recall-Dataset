services:
  app:
    image: ${RECALL_IMAGE}
    container_name: ${RECALL_CONTAINER}
    env_file: ${RECALL_ENV_FILE}
    ports:
      - "127.0.0.1:${RECALL_PORT}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      io.recall.dataset: browser-source-maps
      io.recall.repo: Open-Dev-Society/OpenStock
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: recall
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 3s
      timeout: 5s
      retries: 30
    labels:
      io.recall.dataset: browser-source-maps
