services:
  app:
    image: recall-web/librechat-ai--librechat:f4154b649efa
    build:
      context: ${RECALL_SOURCE_DIR}
      dockerfile: ${RECALL_RECIPE_DIR}/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:3080"
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://database:27017/LibreChat
      SEARCH: "false"
      CREDS_KEY: ${CREDS_KEY:?set in the local env file}
      CREDS_IV: ${CREDS_IV:?set in the local env file}
      JWT_SECRET: ${JWT_SECRET:?set in the local env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in the local env file}
  database:
    image: mongo:8.0.20
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
