services:
  app:
    image: ${RECALL_IMAGE}
    container_name: ${RECALL_CONTAINER}
    env_file: ${RECALL_ENV_FILE}
    command:
      - sh
      - -ec
      - |
        bundle exec rake db:migrate db:seed
        printf '%s\n\n' 'dataset-admin@example.invalid' | RANDOM_PASSWORD=1 bundle exec rake admin:create
        exec bundle exec pitchfork -c config/pitchfork.conf.rb
    ports:
      - "127.0.0.1:${RECALL_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      io.recall.dataset: browser-source-maps
      io.recall.repo: discourse/discourse
  db:
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      POSTGRES_DB: discourse
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "discourse", "-d", "discourse"]
      interval: 3s
      timeout: 5s
      retries: 30
    labels:
      io.recall.dataset: browser-source-maps
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    labels:
      io.recall.dataset: browser-source-maps
